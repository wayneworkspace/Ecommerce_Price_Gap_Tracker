# Danh sách SKU cần theo dõi, và các LISTING của từng SKU trên từng sàn.
#
# Đây là DỮ LIỆU, không phải code: thêm listing / đổi SKU chỉ sửa file này,
# không đụng Python, không cần sửa test.
#
# ---------------------------------------------------------------------------
# Vì sao mỗi nguồn là một DANH SÁCH chứ không phải một listing
# ---------------------------------------------------------------------------
# Cùng một sản phẩm được nhiều người bán khác nhau rao trên cùng một sàn, mỗi
# người một item_id riêng. Đó chính là dữ liệu trả lời câu hỏi kinh doanh của
# dự án: "seller nào đang bán dưới giá niêm yết". Nếu mỗi nguồn chỉ có một
# listing thì không bao giờ tính ra được gap — hoá ra là so giá cửa hàng chính
# hãng với chính nó.
#
# ---------------------------------------------------------------------------
# listing_title dùng để làm gì
# ---------------------------------------------------------------------------
# KHÔNG phải để code đọc. Code không dùng field này.
#
# Nó là BẰNG CHỨNG cho quyết định ánh xạ. Hai shop dưới đây đặt tên khác nhau
# ("G102 Lightsync" và "G102 Gen2 Lightsync") nhưng đã được xác nhận bản chất
# là cùng một sản phẩm, nên xếp chung một SKU logic. Ba tháng sau nhìn lại,
# hai dòng chỉ có item_id thì không ai kiểm chứng nổi phép ánh xạ đó đúng hay
# sai — giữ nguyên văn tiêu đề người bán đặt thì kiểm được.
#
# reference_price: giá niêm yết chính hãng (VND), gắn với SKU logic chứ không
# gắn với listing. dbt seed file này thành bảng rồi join qua cột `sku` để ra
# price_gap. Đó là lý do record phải mang `sku`, không chỉ mang item_id.
#
# URL đã cắt bỏ đuôi ?extraParams=... — nó gắn với phiên xem của một người
# dùng cụ thể, không cần cho việc cào, và chính nó từng lộ ra trong ảnh docs.

